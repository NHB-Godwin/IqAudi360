# ==============================================================================
# iqAudi360 Platform — Enterprise Nginx Reverse Proxy Configuration
# ==============================================================================

# 1. Main Application Dashboard
server {
    listen 80;
    server_name home.iqaudi.com;

    # Security Headers (OWASP & Ship Checklist Hardening)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Static Assets Fast Delivery
    location /static/ {
        alias /home/ubuntu/iqaudi360/strix/gui/static/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Core Application Proxy (Gunicorn)
    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Real-time SSE Live Streaming & Long Scans
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
        proxy_cache off;
    }
}

